[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superautoresearch"
version = "0.1.0"
description = "CLI and verifier toolkit for superAutoResearch open research challenges"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.18.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
sar = "sar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sar*"]

[tool.setuptools.package-data]
"sar.schemas" = ["*.json"]
