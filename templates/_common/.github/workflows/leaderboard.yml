name: leaderboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild leaderboard.json and README table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=.sar python3 -m sar leaderboard . --prs

      - name: Commit updated leaderboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet leaderboard.json README.md; then
            git add leaderboard.json README.md
            git commit -m "chore(leaderboard): update records and claims [skip ci]"
            git push
          fi
