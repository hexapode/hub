name: validate-entry

on:
  pull_request:
    paths:
      - "registry/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate changed registry entries
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'registry/*.toml' || true)
          echo "## Registered Challenge Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in $CHANGED; do
            if [ -f "$f" ] && [[ "$f" != *.records.toml ]]; then
              echo "Validating $f..."
              python3 -m sar validate "$f" --external
              SLUG=$(basename "$f" .toml)
              echo "- **Validated:** \`$f\` (\`$SLUG\`)" >> "$GITHUB_STEP_SUMMARY"
              echo "  - Hub Leaderboard URL: \`https://superautoresearch.github.io/hub/#/c/$SLUG\`" >> "$GITHUB_STEP_SUMMARY"
              echo "  - Donate Prompt: \`Read https://github.com/superautoresearch/hub/blob/main/donate.md and follow it. challenge: $SLUG\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

